[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dropblock"
version = "1.0.0"
description = "A cross-platform CLI tool to ignore files and folders in Dropbox"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]
keywords = ["dropbox", "ignore", "sync", "cli", "utility"]

[project.urls]
Homepage = "https://github.com/yourusername/dropblock"
Repository = "https://github.com/yourusername/dropblock"
Issues = "https://github.com/yourusername/dropblock/issues"

[project.scripts]
dropblock = "dropblock:main"

[tool.setuptools]
py-modules = ["dropblock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dropblock*"]
exclude = ["tests*"]