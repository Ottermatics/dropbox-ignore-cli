name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if version needs updating
        run: |
          # Check if Python or TOML files have changed
          if git diff --name-only HEAD^ HEAD | grep -E '\.(py|toml)$'; then
            echo "Python or TOML files have changed"
            
            # Extract version from pyproject.toml
            VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            echo "Current version: $VERSION"
            
            # Check if a release with this version already exists
            if git tag | grep -q "^v$VERSION$"; then
              echo "::error::Version $VERSION already exists as a release. Please update the version in pyproject.toml"
              exit 1
            fi
          fi

  test:
    needs: check-version
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      
      - name: Check formatting with Black
        run: |
          black --check dropblock.py test/
      
      - name: Format code with Black (if needed)
        if: failure()
        run: |
          black dropblock.py test/
          echo "::warning::Code was reformatted with Black. Please run 'black .' locally."
      
      - name: Run tests
        run: |
          python -m pytest test/ -v
      
      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration-test:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Test CLI installation
        run: |
          dropblock --help
      
      - name: Create test directory structure
        run: |
          mkdir -p test_dropbox_ignore/folder1
          mkdir -p test_dropbox_ignore/folder2
          echo "test" > test_dropbox_ignore/file1.txt
          echo "test" > test_dropbox_ignore/folder1/file2.txt
      
      - name: Test basic ignore functionality
        run: |
          dropblock test_dropbox_ignore/file1.txt --no-output
      
      - name: Test wildcard functionality
        run: |
          dropblock test_dropbox_ignore/folder*/* --no-output
      
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf test_dropbox_ignore